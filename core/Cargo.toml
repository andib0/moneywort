[package]
name = "penny-core"
version = "0.1.0"
edition = "2024"
description = "Storage and finance logic for Penny"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
