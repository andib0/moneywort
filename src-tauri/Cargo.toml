[package]
name = "moneywort"
version = "0.1.1"
description = "Local-first personal finance tracker"
license = "MIT"
authors = ["andi"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows.
name = "moneywort_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde_json = "1"
moneywort-core = { path = "../core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
